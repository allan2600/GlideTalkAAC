<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GlideTalk AAC</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none; /* Disables default page scrolling/zooming */
    }

    /* Enforce rigid pointer stability - no child elements register trace hits */
    .speech-tile *, 
    .hub-tile *, 
    .drawer-btn *,
    #progress-canvas {
      pointer-events: none !important;
    }

    body {
      margin: 0;
      padding: calc(12px + env(safe-area-inset-top, 0px)) 12px 12px 12px;
      height: 100vh;
      width: 100vw;
      background-color: #0F172A;
      color: #F8FAFC;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: hidden;
      position: fixed;
    }

    /* Responsive Grid Screen Container */
    .screen-container {
      flex: 1;
      width: 100%;
      height: 100%;
      max-height: 100%;
      margin: 0 auto;
      overflow: hidden; 
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* Start Screen Overlay */
    #start-overlay {
      position: fixed;
      inset: 0;
      background: #0F172A;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      gap: 20px;
    }

    #start-btn {
      font-size: clamp(1.2rem, 3vw, 2rem);
      padding: 18px 36px;
      background-color: #2563EB;
      color: white;
      border: none;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
    }

    /* Header & Category Drawers */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: clamp(40px, 8vh, 54px);
      gap: 12px;
      flex-shrink: 0;
    }

    .category-drawers {
      display: flex;
      gap: 8px;
      flex: 1;
      overflow-x: auto;
      height: 100%;
    }

    .drawer-btn {
      flex: 1;
      min-width: 80px;
      background-color: #1E293B;
      border: 2px solid #334155;
      border-radius: 12px;
      color: white;
      font-size: clamp(0.8rem, 2vw, 1.1rem);
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.15s, border-color 0.15s;
    }

    .drawer-btn.active {
      background-color: #2563EB;
      border-color: #60A5FA;
      box-shadow: inset 0 0 10px rgba(255,255,255,0.3);
    }

    #settings-btn {
      width: clamp(40px, 8vh, 54px);
      height: 100%;
      background-color: #334155;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Viewport Area for Grid / Radial Boards */
    #board-container {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    /* Progress Overlay Canvas for Dwell Ring */
    #progress-canvas {
      position: absolute;
      inset: 0;
      z-index: 500;
    }

    /* REACTIVE GRID LAYOUT */
    .grid-board {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 12px;
      width: 100%;
      height: 100%;
    }

    .speech-tile {
      background-color: #1E293B;
      border: clamp(3px, 0.8vw, 6px) solid #334155;
      border-radius: clamp(12px, 2.5vw, 24px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4px;
      color: #FFFFFF;
      position: relative;
      box-sizing: border-box;
      transition: background-color 0.15s, border-color 0.15s;
      
      /* Enable Container Queries to scale internal font size relative to tile size */
      container-type: inline-size;
      width: 100%;
      height: 100%;
    }

    /* Fluid Tile Text & Emoji Scaling */
    .speech-tile .emoji {
      font-size: clamp(1.8rem, 22cqw, 4.5rem);
      line-height: 1;
    }

    .speech-tile .label {
      font-size: clamp(0.9rem, 10cqw, 2rem);
      font-weight: bold;
      text-align: center;
      padding: 0 4px;
      word-break: break-word;
    }

    /* Active hover and trigger highlights */
    .speech-tile.active {
      background-color: #1E40AF;
      border-color: #60A5FA;
      box-shadow: inset 0 0 20px rgba(96, 165, 250, 0.5);
    }

    .speech-tile.triggered {
      background-color: #15803D;
      border-color: #4ADE80;
    }

    /* REACTIVE RADIAL LAYOUT */
    .radial-board {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .hub-tile {
      position: absolute;
      top: 50%;
      left: 50%;
      width: clamp(80px, 22vh, 140px);
      height: clamp(80px, 22vh, 140px);
      transform: translate(-50%, -50%);
      background-color: #0F172A;
      border: clamp(3px, 0.6vw, 6px) solid #38BDF8;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      box-sizing: border-box;
      container-type: inline-size;
    }

    .hub-tile .hub-icon {
      font-size: clamp(1.4rem, 28cqw, 2.5rem);
    }

    .hub-tile .hub-label {
      font-size: clamp(0.7rem, 12cqw, 1.1rem);
      font-weight: bold;
    }

    .hub-tile.active {
      background-color: #0284C7;
      border-color: #7DD3FC;
    }

    .radial-tile {
      position: absolute;
      width: clamp(70px, 18vh, 120px);
      height: clamp(70px, 18vh, 120px);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background-color: #1E293B;
      border: clamp(3px, 0.6vw, 6px) solid #334155;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    /* Settings Panel Overlay */
    #settings-panel {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.98);
      z-index: 2000;
      display: none;
      padding: calc(24px + env(safe-area-inset-top, 0px)) 24px 24px 24px;
      overflow-y: auto;
      touch-action: pan-y !important;
    }

    .settings-content {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      touch-action: pan-y !important;
    }

    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .setting-group label {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .setting-group input, 
    .setting-group select, 
    .setting-group textarea {
      padding: 12px;
      border-radius: 8px;
      border: 2px solid #334155;
      background: #1E293B;
      color: white;
      font-size: 1rem;
      user-select: text !important;
      -webkit-user-select: text !important;
      touch-action: pan-y !important;
      pointer-events: auto !important;
    }

    textarea {
      height: 180px;
      font-family: monospace;
      overflow-y: auto !important;
      resize: vertical;
    }

    .close-btn {
      padding: 16px;
      background: #2563EB;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="start-overlay">
    <h1>GlideTalk AAC</h1>
    <p>Trace continuously to speak</p>
    <button id="start-btn">Touch Anywhere to Start</button>
  </div>

  <div class="screen-container">
    <header>
      <div class="category-drawers" id="drawers-container"></div>
      <button id="settings-btn">⚙️</button>
    </header>

    <div id="board-container">
      <canvas id="progress-canvas"></canvas>
      <div id="board" class="grid-board"></div>
    </div>
  </div>

  <div id="settings-panel">
    <div class="settings-content">
      <h2>App Configuration</h2>

      <div class="setting-group">
        <label for="layout-mode">Layout Style</label>
        <select id="layout-mode">
          <option value="grid">Grid Board (4 Large Tiles)</option>
          <option value="radial">Radial Wheel (Center Hub Switcher)</option>
        </select>
      </div>

      <div class="setting-group">
        <label for="dwell-input">Dwell Activation Time (ms)</label>
        <input type="number" id="dwell-input" value="400" step="50" min="0">
      </div>

      <div class="setting-group">
        <label for="deadzone-input">Dead-Zone Padding (px)</label>
        <input type="number" id="deadzone-input" value="15" step="5" min="0">
      </div>

      <div class="setting-group">
        <label for="json-input">JSON Configuration File</label>
        <textarea id="json-input" spellcheck="false"></textarea>
      </div>

      <button class="close-btn" id="save-settings">Save &amp; Close</button>
    </div>
  </div>

  <script>
    // Configuration Object
    let appConfig = {
      dwellTimeMs: 400,
      deadZonePx: 15,
      layout: "grid",
      categories: [
        {
          id: "basic",
          name: "Basic",
          icon: "💬",
          tiles: [
            { label: "Yes", emoji: "👍", phrase: "Yes" },
            { label: "No", emoji: "👎", phrase: "No" },
            { label: "Help", emoji: "🙋‍♂️", phrase: "I need help" },
            { label: "More", emoji: "🔄", phrase: "More please" }
          ]
        },
        {
          id: "needs",
          name: "Needs",
          icon: "🚰",
          tiles: [
            { label: "Water", emoji: "💧", phrase: "I want water" },
            { label: "Food", emoji: "🍲", phrase: "I am hungry" },
            { label: "Rest", emoji: "🛋️", phrase: "I need to rest" },
            { label: "Bathroom", emoji: "🚽", phrase: "I need the bathroom" }
          ]
        },
        {
          id: "feelings",
          name: "Feelings",
          icon: "😊",
          tiles: [
            { label: "Happy", emoji: "😊", phrase: "I feel happy" },
            { label: "Pain", emoji: "😣", phrase: "I am in pain" },
            { label: "Tired", emoji: "🥱", phrase: "I am tired" },
            { label: "Cold", emoji: "🥶", phrase: "I am cold" }
          ]
        }
      ]
    };

    let currentCategoryIndex = 0;
    
    // Gesture & Latched State Tracker
    let activeTarget = null;
    let hasTriggered = false;
    let dwellTimer = null;
    let dwellStartTime = 0;
    let animFrame = null;

    const board = document.getElementById('board');
    const drawersContainer = document.getElementById('drawers-container');
    const canvas = document.getElementById('progress-canvas');
    const ctx = canvas.getContext('2d');
    const settingsPanel = document.getElementById('settings-panel');

    function resizeCanvas() {
      canvas.width = board.clientWidth;
      canvas.height = board.clientHeight;
    }
    window.addEventListener('resize', () => {
      resizeCanvas();
      if (appConfig.layout === 'radial') renderBoard();
    });

    function renderDrawers() {
      drawersContainer.innerHTML = '';
      appConfig.categories.forEach((cat, index) => {
        const btn = document.createElement('div');
        btn.className = `drawer-btn ${index === currentCategoryIndex ? 'active' : ''}`;
        btn.dataset.categoryIndex = index;
        btn.innerHTML = `<span>${cat.icon}</span> <span>${cat.name}</span>`;
        drawersContainer.appendChild(btn);
      });
    }

    function renderBoard() {
      board.innerHTML = '';
      const currentCat = appConfig.categories[currentCategoryIndex];

      if (appConfig.layout === 'grid') {
        board.className = 'grid-board';
        currentCat.tiles.slice(0, 4).forEach(tileData => {
          const tile = document.createElement('div');
          tile.className = 'speech-tile';
          tile.dataset.phrase = tileData.phrase;
          tile.innerHTML = `<span class="emoji">${tileData.emoji}</span><span class="label">${tileData.label}</span>`;
          board.appendChild(tile);
        });
      } else {
        board.className = 'radial-board';
        
        const hub = document.createElement('div');
        hub.className = 'hub-tile';
        hub.dataset.isHub = 'true';
        hub.innerHTML = `<span class="hub-icon">${currentCat.icon}</span><span class="hub-label">${currentCat.name}</span>`;
        board.appendChild(hub);

        const tiles = currentCat.tiles;
        const total = Math.min(tiles.length, 6);
        const radius = Math.min(board.clientWidth, board.clientHeight) * 0.33;
        const centerX = board.clientWidth / 2;
        const centerY = board.clientHeight / 2;

        tiles.slice(0, total).forEach((tileData, i) => {
          const angle = (i * (2 * Math.PI / total)) - (Math.PI / 2);
          const x = centerX + radius * Math.cos(angle);
          const y = centerY + radius * Math.sin(angle);

          const tile = document.createElement('div');
          tile.className = 'speech-tile radial-tile';
          tile.style.left = `${x}px`;
          tile.style.top = `${y}px`;
          tile.dataset.phrase = tileData.phrase;
          tile.innerHTML = `<span class="emoji">${tileData.emoji}</span><span class="label">${tileData.label}</span>`;
          board.appendChild(tile);
        });
      }
      setTimeout(resizeCanvas, 50);
    }

    // Single-Touch Tracking Gesture Engine
    function handlePointerMove(e) {
      if (settingsPanel.style.display === 'block') return;

      const rawTarget = document.elementFromPoint(e.clientX, e.clientY);
      if (!rawTarget) return;

      const target = rawTarget.closest('.speech-tile, .hub-tile, .drawer-btn');
      
      if (target) {
        const rect = target.getBoundingClientRect();
        const pad = appConfig.deadZonePx;
        const insideInnerBounds = (
          e.clientX >= rect.left + pad &&
          e.clientX <= rect.right - pad &&
          e.clientY >= rect.top + pad &&
          e.clientY <= rect.bottom - pad
        );

        if (!insideInnerBounds && pad > 0) {
          clearActiveState();
          return;
        }
      }

      if (target !== activeTarget) {
        clearActiveState();

        if (target) {
          activeTarget = target;
          hasTriggered = false;
          activeTarget.classList.add('active');
          
          dwellStartTime = Date.now();
          if (appConfig.dwellTimeMs > 0) {
            dwellTimer = setTimeout(() => triggerActivation(activeTarget), appConfig.dwellTimeMs);
            animateProgress();
          } else {
            triggerActivation(activeTarget);
          }
        }
      }
    }

    function animateProgress() {
      if (!activeTarget || hasTriggered || appConfig.dwellTimeMs <= 0) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const elapsed = Date.now() - dwellStartTime;
      const progress = Math.min(elapsed / appConfig.dwellTimeMs, 1);

      const rect = activeTarget.getBoundingClientRect();
      const boardRect = board.getBoundingClientRect();
      
      const cx = rect.left - boardRect.left + rect.width / 2;
      const cy = rect.top - boardRect.top + rect.height / 2;
      const r = Math.min(rect.width, rect.height) / 2 - 8;

      ctx.beginPath();
      ctx.arc(cx, cy, r, -Math.PI / 2, (-Math.PI / 2) + (Math.PI * 2 * progress));
      ctx.strokeStyle = '#60A5FA';
      ctx.lineWidth = Math.max(4, rect.width * 0.05);
      ctx.stroke();

      if (progress < 1) {
        animFrame = requestAnimationFrame(animateProgress);
      }
    }

    function triggerActivation(target) {
      if (hasTriggered) return;

      hasTriggered = true;
      if (dwellTimer) clearTimeout(dwellTimer);
      if (animFrame) cancelAnimationFrame(animFrame);
      dwellTimer = null;
      animFrame = null;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      target.classList.remove('active');
      target.classList.add('triggered');
      setTimeout(() => target.classList.remove('triggered'), 400);

      if (target.dataset.isHub) {
        currentCategoryIndex = (currentCategoryIndex + 1) % appConfig.categories.length;
        renderDrawers();
        renderBoard();
      } else if (target.classList.contains('drawer-btn')) {
        currentCategoryIndex = parseInt(target.dataset.categoryIndex, 10);
        renderDrawers();
        renderBoard();
      } else if (target.dataset.phrase) {
        speakPhrase(target.dataset.phrase);
      }
    }

    function clearActiveState() {
      if (dwellTimer) clearTimeout(dwellTimer);
      if (animFrame) cancelAnimationFrame(animFrame);
      dwellTimer = null;
      animFrame = null;
      hasTriggered = false;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (activeTarget) {
        activeTarget.classList.remove('active');
        activeTarget = null;
      }
    }

    function speakPhrase(phrase) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(phrase);
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    document.addEventListener('pointerdown', handlePointerMove);
    document.addEventListener('pointermove', handlePointerMove);
    document.addEventListener('pointerup', clearActiveState);
    document.addEventListener('pointercancel', clearActiveState);

    document.getElementById('start-btn').addEventListener('click', () => {
      document.getElementById('start-overlay').style.display = 'none';
      if ('speechSynthesis' in window) {
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
      }
      renderDrawers();
      renderBoard();
    });

    const jsonInput = document.getElementById('json-input');

    document.getElementById('settings-btn').addEventListener('click', () => {
      document.getElementById('layout-mode').value = appConfig.layout;
      document.getElementById('dwell-input').value = appConfig.dwellTimeMs;
      document.getElementById('deadzone-input').value = appConfig.deadZonePx;
      jsonInput.value = JSON.stringify(appConfig.categories, null, 2);
      settingsPanel.style.display = 'block';
    });

    document.getElementById('save-settings').addEventListener('click', () => {
      appConfig.layout = document.getElementById('layout-mode').value;
      appConfig.dwellTimeMs = parseInt(document.getElementById('dwell-input').value, 10) || 0;
      appConfig.deadZonePx = parseInt(document.getElementById('deadzone-input').value, 10) || 0;

      try {
        appConfig.categories = JSON.parse(jsonInput.value);
        currentCategoryIndex = 0;
      } catch (err) {
        alert('Invalid JSON config format. Preserving prior setup.');
      }

      settingsPanel.style.display = 'none';
      renderDrawers();
      renderBoard();
    });
  </script>
</body>
</html>
